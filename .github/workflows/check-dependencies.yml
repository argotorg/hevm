name: "Check Dependencies"
on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * 1' # At 05:30 AM, only on Monday
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/check-dependencies.yml'
      - 'flake.*'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34
      - name: lookup nix versions
        id: nixpkgs
        run: |
          VERSIONS="$(nix eval --impure --json --expr '
            let
              flake = builtins.getFlake ("git+file://" + toString ./.);
              system = builtins.currentSystem;
              pkgs = import flake.inputs.nixpkgs {
                inherit system;
                overlays = [ flake.inputs.foundry.overlay ];
              };
            in {
              ghc = (builtins.getAttr system flake.packages).ci.compiler.version;
              libff = pkgs.libff.version;
              libsecp256k1 = pkgs.secp256k1.version;
              geth = pkgs.go-ethereum.version;
              z3 = pkgs.z3.version;
              cvc5 = pkgs.cvc5.version;
              bitwuzla = pkgs.bitwuzla.version;
              foundry = pkgs.foundry-bin.version;
              solidity = flake.inputs.solidity.rev;
              forge_std = flake.inputs.forge-std.rev;
            }')"
          echo "versions=$VERSIONS" >> "$GITHUB_OUTPUT"
      - name: compare Windows versions with the flake
        shell: python
        env:
          NIX_VERSIONS: ${{ steps.nixpkgs.outputs.versions }}
        run: |
          import json
          import os
          from pathlib import Path
          import re
          import sys

          def extract(pattern, text, name):
              matches = re.findall(pattern, text, re.MULTILINE)
              if len(matches) != 1:
                  sys.exit(f"Expected one {name} version, found {len(matches)}")
              return matches[0]

          build = Path(".github/workflows/build.yml").read_text()
          windows = build.split("  build-windows:\n", 1)[1].split("\n  cabal-check:", 1)[0]
          expected = json.loads(os.environ["NIX_VERSIONS"])
          expected["solc"] = extract(r"solc_([0-9_]+)", Path("flake.nix").read_text(), "flake solc").replace("_", ".")
          local = {
              "ghc": extract(r"ghc-version:\s*'([^']+)'", windows, "GHC"),
              "libff": extract(r"^INSTALL_VERSION=(\S+)$", Path(".github/scripts/install-libff.sh").read_text(), "libff"),
              "libsecp256k1": extract(r"^INSTALL_VERSION=(\S+)$", Path(".github/scripts/install-libsecp256k1.sh").read_text(), "libsecp256k1"),
              "geth": extract(r"go-ethereum/cmd/evm@v([0-9.]+)", windows, "Geth"),
              "z3": extract(r"z3/releases/download/z3-([0-9.]+)/", windows, "Z3"),
              "cvc5": extract(r"cvc5/releases/download/cvc5-([0-9.]+)/", windows, "cvc5"),
              "bitwuzla": extract(r"bitwuzla/releases/download/([0-9.]+)/", windows, "Bitwuzla"),
              "foundry": extract(r"uses: foundry-rs/foundry-toolchain[^\n]*\n\s*with:\n\s*version: v([0-9.]+)", windows, "Foundry"),
              "solidity": extract(r"repository: argotorg/solidity\s+ref:\s*(\w+)", windows, "Solidity source"),
              "forge_std": extract(r"repository: foundry-rs/forge-std\s+ref:\s*(\w+)", windows, "forge-std"),
              "solc": extract(r"solidity/releases/download/v([0-9.]+)/", windows, "solc"),
          }
          failed = False
          for name, nix_version in expected.items():
              windows_version = local[name]
              if nix_version != windows_version:
                  print(f"::error::{name} versions do not match! nix={nix_version} windows={windows_version}")
                  failed = True
              else:
                  print(f"{name}: {nix_version}")
          sys.exit(1 if failed else 0)
