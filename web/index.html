<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hevm in the browser</title>
  </head>
  <body data-mode="symbolic">
    <header>
      <h1>hevm <span>in the browser</span></h1>
      <p>
        The <a href="https://github.com/argotorg/hevm">hevm</a> symbolic EVM and the
        <a href="https://bitwuzla.github.io/">bitwuzla</a> SMT solver, compiled to WebAssembly.
        Nothing leaves your machine.
      </p>
    </header>
    <main>
      <form id="form">
        <label class="row">
          <span>Example</span>
          <select id="example"></select>
        </label>
        <fieldset class="modes">
          <label><input type="radio" name="mode" value="symbolic" checked /> Symbolic</label>
          <label><input type="radio" name="mode" value="exec" /> Concrete</label>
        </fieldset>
        <label>
          <span>Runtime bytecode</span>
          <textarea id="code" rows="4" spellcheck="false"></textarea>
        </label>
        <label class="exec-only">
          <span>Calldata</span>
          <input id="calldata" spellcheck="false" placeholder="0x" />
        </label>
        <label class="symbolic-only">
          <span>Function signature <small>(optional, e.g. <code>f(uint256)</code>)</small></span>
          <input id="sig" spellcheck="false" />
        </label>
        <div class="actions">
          <button id="run" type="submit">Run</button>
          <span id="status"></span>
        </div>
      </form>
      <section id="outcome" class="outcome"></section>
      <details>
        <summary>hevm output</summary>
        <pre id="log"></pre>
      </details>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
